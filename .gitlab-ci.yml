# This pipeline has three objectives:
#   - Test ThermoSysPro with OpenModelica on the OS repository using GitLab
#     runners directly.
#   - Test ThermoSysPro with Dymola on an internal VM (PAM) through a mirrored
#     internal project, so the runner can access the Dymola licence server.
#   - Deploy the ThermoSysPro documentation.
#
# The objectives of the test section are:
#   - Test ThermoSysPro examples within the library
#   - Test extra models (additional gitlab/github projects)
# Options to be developed:
#   - Evaluate changes on some realistic studies (calibration, optimisation, 
# uncertainties propagations...)
#

stages:          # List of stages for jobs, and their order of execution
  - test
  - build
  - deploy

test-job-openmodelica:
  stage: test
  # OpenModelica image configured in the GitLab CI/CD variable
  # openmodelica_image.
  image: "$openmodelica_image"
  before_script:
    # git is needed to clone ModelicaTests; python3-venv is used to avoid
    # installing Python packages as root in the Docker job.
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates python3-venv
    # GitLab Docker jobs run as root by default. OpenModelica/omc4py should be
    # run as a regular user, so the tests are launched through ciuser.
    - useradd --create-home --shell /bin/bash ciuser
  script:
    - echo "$CI_PROJECT_NAME"
    - echo "$CI_PROJECT_PATH"
    - echo "$CI_PROJECT_URL"
    - which omc
    # Clone ModelicaTests with a token stored as the ThermoSysPro CI/CD
    # variable modelicaTests_token.
    - git clone https://token:$modelicaTests_token@gitlab.pam-retd.fr/thermosysproandco/modelicatests.git
    - cd modelicatests
    # Copy ThermoSysPro test configuration files into the ModelicaTests test
    # directory, where the runner expects them.
    - cp ../.test/*.json tests/
    - |
      cat > tests/local_config.json <<'JSON'
      {
        "dymola": {
          "egg": "",
          "exe": ""
        },
        "openmodelica": {
          "exe": "/usr/bin/omc"
        }
      }
      JSON
    # Give ciuser ownership of the checkout so OpenModelica and ModelicaTests
    # can write simulation outputs, logs and HTML reports.
    - chown -R ciuser:ciuser "$CI_PROJECT_DIR"
    - |
      su ciuser -c "cd '$CI_PROJECT_DIR/modelicatests' && python3 -m venv .venv && . .venv/bin/activate && python -m pip install --upgrade pip && python -m pip install ."
    - |
      su ciuser -c "cd '$CI_PROJECT_DIR/modelicatests/tests' && . ../.venv/bin/activate && python3 run_cli.py config_new_openmodelica.json --ncpus 7 --timeout 120"
  rules:
    - if: '$CI_PROJECT_NAME == "ThermoSysPro" && ($CI_COMMIT_BRANCH == "master" || $CI_MERGE_REQUEST_ID)'
  artifacts:
    when: always
    reports:
      junit: modelicatests/tests/*-junit.xml
      annotations: modelicatests/tests/annotations.json
    paths:
      - modelicatests/tests/*.csv
      - modelicatests/tests/*.html
      - modelicatests/tests/*-junit.xml
      - modelicatests/tests/annotations.json


test-job-dymola-internal:
  stage: test
  image: nexus.retd.edf.fr:5097/dymola:2025.1Fix
  script:
    - echo $CI_PROJECT_NAME
    - echo $CI_PROJECT_PATH
    - echo $CI_PROJECT_URL
    #- curl --header "PRIVATE-TOKEN:$modelicaTests_token" --url "https://gitlab.pleiade.edf.fr/api/v4/projects/10790/repository/archive" --OUTPUT modelicaTests.tar.gz
    #- tar -xvzf modelicaTests.tar.gz
    #- git clone https://token:$modelicaTests_token@gitlab.pam-retd.fr/thermosysproandco/modelicatests.git
    - git clone https://token:$modelicaTests_mirror_token@gitlab.pleiade.edf.fr/Phy13Models/pythontools/modelicatests_mirror.git
    - cd modelicatests*
    - python3 -m pip install --upgrade pip
    - pip install .
    - cd tests
    - cp ../../.test/*.json ./
    - dir
    - python3 run_cli.py config_ref.json config_new.json --ncpus 10 --timeout 60
  rules:
    - if: $CI_PROJECT_NAME == "ThermoSysPro_mirror"
  artifacts:
    when: always
    reports:
      junit: modelicatests*/tests/*-junit.xml
      annotations: modelicatests*/tests/annotations.json
    paths:
      - modelicatests*/tests/*.csv
      - modelicatests*/tests/*.html
      - modelicatests*/tests/*-junit.xml
      - modelicatests*/tests/annotations.json


# Smoke-test that the Docker image contains enough Python and OpenModelica
# tooling to read the Modelica annotations used to generate the book.
documentation-environment:
  stage: test
  image: "$openmodelica_image"
  script:
    # GitLab Docker jobs run as root by default. OpenModelica refuses to start
    # its ZMQ server as root, and omc4py needs that server, so use ciuser.
    - useradd --create-home --shell /bin/bash ciuser
    - chown -R ciuser:ciuser "$CI_PROJECT_DIR"
    - omc --version
    - python3 --version
    - python3 -m pip install -r .documentation/requirements.txt
    - python3 -c "import yaml, tqdm; print('Python documentation dependencies are available')"
    - su ciuser -c "test -f ThermoSysPro/package.mo"
    - su ciuser -c "python3 -c 'import omc4py; omc = omc4py.open_session(); print(omc.getVersion()); assert omc.loadFile(\"ThermoSysPro/package.mo\"); classes = omc.getClassNames(\"ThermoSysPro\"); print(\"Loaded ThermoSysPro with\", len(classes), \"top-level classes\"); omc.close()'"
  rules:
    - if: '$CI_PROJECT_NAME == "ThermoSysPro" && ($CI_COMMIT_BRANCH == "master" || $CI_MERGE_REQUEST_ID)'

# Generate Markdown from the Modelica annotations, then build the Jupyter Book.
jupyter-build:
  stage: build
  image: "$openmodelica_image"
  script:
    # The documentation generator opens an omc4py session, so it must also run
    # as a non-root user for the same OpenModelica ZMQ security reason.
    - useradd --create-home --shell /bin/bash ciuser
    - chown -R ciuser:ciuser "$CI_PROJECT_DIR"
    - python3 -m pip install -r .documentation/requirements.txt
    - su ciuser -c "cd .documentation && python3 mo_to_book.py"
    - su ciuser -c "cd .documentation && jupyter-book clean ."
    - su ciuser -c "cd .documentation && jupyter-book build ."
  rules:
    - if: '$CI_PROJECT_NAME == "ThermoSysPro" && ($CI_COMMIT_BRANCH == "master" || $CI_MERGE_REQUEST_ID)'
  artifacts:
    paths:
      - .documentation/_build/

# GitLab Pages serves files from a top-level public/ directory.
pages:
  stage: deploy
  image: busybox:latest
  script:
    - mv .documentation/_build/html public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_PROJECT_NAME == "ThermoSysPro" && $CI_COMMIT_BRANCH == "master"'
